name: Build Godot 4.7.2 iOS Editor IPA

on:
  workflow_dispatch:
    inputs:
      godot_tag:
        description: 'Godot Git Tag'
        required: true
        default: '4.7.2-stable'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Install Dependencies
        run: brew install scons

      - name: Checkout Godot Source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ github.event.inputs.godot_tag }}
          path: godot
          fetch-depth: 1

      # --- SCONS BUILD CACHE SYSTEM ---
      # This saves your compiled C++ files so future runs take minutes, not hours!
      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: ${{ runner.os }}-godot-${{ github.event.inputs.godot_tag }}-editor
          restore-keys: |
            ${{ runner.os }}-godot-${{ github.event.inputs.godot_tag }}-

      - name: Compile Godot 4.7.2 for iOS (Editor Target)
        working-directory: godot
        env:
          SCONS_CACHE: .scons_cache
          SCONS_CACHE_LIMIT: 4096 # Caps cache at 4GB
        run: |
          sed -i '' 's/env\["tools"\] = False/pass/g' platform/ios/detect.py || true
          sed -i '' 's/env\["editor_build"\] = False/pass/g' platform/ios/detect.py || true
          
          scons platform=ios target=editor arch=arm64 generate_bundle=yes -j$(sysctl -n hw.ncpu)

      - name: Prepare Apple Embedded Xcode Template
        working-directory: godot
        run: |
          cp -r misc/dist/apple_embedded_xcode ios_project

          if [ -d "bin/libgodot.ios.editor.arm64.xcframework" ]; then
            cp -r bin/libgodot.ios.editor.arm64.xcframework ios_project/libgodot.ios.release.xcframework
          else
            mkdir -p ios_project/libgodot.ios.release.xcframework/ios-arm64
            cp bin/libgodot.ios.editor.arm64.a ios_project/libgodot.ios.release.xcframework/ios-arm64/libgodot.a
          fi

          # FIXED: Target EXACTLY "Info.plist" to avoid corrupting internal Xcode internal configuration project files
          find ios_project -name "Info.plist" -exec sed -i '' 's/\$name/GodotEditor/g' {} +
          find ios_project -name "Info.plist" -exec sed -i '' 's/\$bundle_identifier/org.godotengine.editor.ios/g' {} +
          find ios_project -name "Info.plist" -exec sed -i '' 's/\$short_version/4.7.2/g' {} +
          find ios_project -name "Info.plist" -exec sed -i '' 's/\$version/4.7.2/g' {} +

      - name: Build Unsigned .ipa with Xcode
        working-directory: godot/ios_project
        run: |
          XCODE_PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)

          xcodebuild -project "$XCODE_PROJ" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GodotEditor.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/GodotEditor.xcarchive/Products/Applications/*.app Payload/
          zip -r GodotEditor-4.7.2-unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotEditor-4.7.2-iOS-IPA
          path: godot/ios_project/GodotEditor-4.7.2-unsigned.ipa
