name: Build Latest Godot iOS Editor IPA

on:
  workflow_dispatch:
    inputs:
      godot_tag:
        description: 'Godot Git Tag (Leave as "latest" to auto-fetch newest stable release)'
        required: true
        default: 'latest'

jobs:
  build-ios-ipa:
    runs-on: macos-15 # Uses Apple Silicon hardware for maximum compilation speeds
    timeout-minutes: 120

    steps:
      - name: Install Dependencies
        run: brew install scons jq

      - name: Determine Latest Stable Godot Version
        id: get-version
        run: |
          if [ "${{ github.event.inputs.godot_tag }}" = "latest" ]; then
            # Fetches the absolute latest release tag from the official Godot GitHub repo
            LATEST_TAG=$(curl -s https://github.com | jq -r '.tag_name')
            echo "TARGET_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Found latest Godot release: $LATEST_TAG"
          else
            echo "TARGET_TAG=${{ github.event.inputs.godot_tag }}" >> $GITHUB_OUTPUT
            echo "Using manually requested version: ${{ github.event.inputs.godot_tag }}"
          fi

      - name: Checkout Godot Source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ steps.get-version.outputs.TARGET_TAG }}
          path: godot
          fetch-depth: 1

      # --- DYNAMIC CACHE SYSTEM ---
      # Automatically creates a separate cache bucket for each unique version of Godot
      - name: Setup SCons Cache
        uses: actions/cache@v4
        with:
          path: godot/.scons_cache
          key: ${{ runner.os }}-godot-${{ steps.get-version.outputs.TARGET_TAG }}-full-editor
          restore-keys: |
            ${{ runner.os }}-godot-

      - name: Compile Godot Engine for iOS (Full Editor Target)
        working-directory: godot
        run: |
          sed -i '' 's/env\["tools"\] = False/pass/g' platform/ios/detect.py || true
          sed -i '' 's/env\["editor_build"\] = False/pass/g' platform/ios/detect.py || true
          
          # Fully intact engine configuration with absolute max hardware threads
          scons platform=ios target=editor arch=arm64 generate_bundle=yes \
            cache_path=.scons_cache cache_size=4096 \
            optimize=speed production=yes debug_symbols=no \
            -j$(sysctl -n hw.ncpu)

      - name: Prepare Apple Embedded Xcode Template
        working-directory: godot
        run: |
          cp -r misc/dist/apple_embedded_xcode ios_project

          if [ -d "bin/libgodot.ios.editor.arm64.xcframework" ]; then
            cp -r bin/libgodot.ios.editor.arm64.xcframework ios_project/libgodot.ios.release.xcframework
          else
            mkdir -p ios_project/libgodot.ios.release.xcframework/ios-arm64
            cp bin/libgodot.ios.editor.arm64.a ios_project/libgodot.ios.release.xcframework/ios-arm64/libgodot.a
          fi

          # DYNAMIC PROFILES: Replaces variables with the dynamically fetched engine version name
          VERSION_CLEAN=$(echo "${{ steps.get-version.outputs.TARGET_TAG }}" | sed 's/-stable//g')
          find ios_project -name "Info.plist" -exec sed -i '' 's/\$name/GodotEditor/g' {} +
          find ios_project -name "Info.plist" -exec sed -i '' "s/\$bundle_identifier/org.godotengine.editor.ios/g" {} +
          find ios_project -name "Info.plist" -exec sed -i '' "s/\$short_version/$VERSION_CLEAN/g" {} +
          find ios_project -name "Info.plist" -exec sed -i '' "s/\$version/$VERSION_CLEAN/g" {} +

      - name: Build Unsigned .ipa with Xcode
        working-directory: godot/ios_project
        run: |
          XCODE_PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          VERSION_CLEAN=$(echo "${{ steps.get-version.outputs.TARGET_TAG }}" | sed 's/-stable//g')

          xcodebuild -project "$XCODE_PROJ" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -parallelizeTargets \
            -archivePath build/GodotEditor.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            VALIDATE_WORKSPACE=NO \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO

          mkdir -p Payload
          cp -r build/GodotEditor.xcarchive/Products/Applications/*.app Payload/
          zip -r "GodotEditor-${VERSION_CLEAN}-unsigned.ipa" Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "GodotEditor-${{ steps.get-version.outputs.TARGET_TAG }}-iOS-IPA"
          path: "godot/ios_project/GodotEditor-*-unsigned.ipa"
