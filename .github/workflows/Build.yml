name: Build Godot iOS Editor IPA

on:
  workflow_dispatch:
    inputs:
      godot_tag:
        description: 'Godot Git Tag (e.g., 4.3-stable or 4.4-stable)'
        required: true
        default: '4.4-stable'

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Install SCons
        run: brew install scons

      - name: Clone Godot Source
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.godot_tag }} https://github.com
          cd godot

      - name: Compile Godot for iOS (Editor Target)
        working-directory: godot
        run: |
          # Note: Standard upstream Godot forces tools=no on iOS unless patched.
          # We patch platform/ios/detect.py to allow building the editor UI.
          sed -i '' 's/env\["tools"\] = False/pass/g' platform/ios/detect.py || true
          
          scons platform=ios target=editor arch=arm64 generate_bundle=yes -j$(sysctl -n hw.ncpu)

      - name: Prepare Xcode Template
        working-directory: godot
        run: |
          # Copy the Xcode template (path varies slightly by Godot version)
          if [ -d "misc/dist/apple_embedded_xcode" ]; then
            cp -r misc/dist/apple_embedded_xcode ios_project
          else
            cp -r misc/dist/ios_xcode ios_project
          fi

          # Copy compiled static library into the xcframework structure
          mkdir -p ios_project/libgodot.ios.release.xcframework/ios-arm64
          cp bin/libgodot.ios.editor.arm64.a ios_project/libgodot.ios.release.xcframework/ios-arm64/libgodot.a

          # Replace placeholders in Info.plist so Xcode builds cleanly
          sed -i '' 's/$name/GodotEditor/g' ios_project/godot_ios/godot_ios-Info.plist || true
          sed -i '' 's/$bundle_identifier/org.godotengine.editor.ios/g' ios_project/godot_ios/godot_ios-Info.plist || true
          sed -i '' 's/$short_version/4.4/g' ios_project/godot_ios/godot_ios-Info.plist || true
          sed -i '' 's/$version/4.4/g' ios_project/godot_ios/godot_ios-Info.plist || true

      - name: Build Unsigned .ipa with Xcode
        working-directory: godot/ios_project
        run: |
          xcodebuild -project godot_ios.xcodeproj \
            -scheme godot_ios \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/GodotEditor.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/GodotEditor.xcarchive/Products/Applications/*.app Payload/
          zip -r GodotEditor-unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotEditor-iOS-IPA
          path: godot/ios_project/GodotEditor-unsigned.ipa
